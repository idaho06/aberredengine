[workspace]
resolver = "3"
members = ["crates/aberred-core", "crates/aberred-audio", "crates/aberred-render", "crates/aberred-lua", "crates/aberredengine"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy_ecs = { version = "0.19" }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
mlua = { version = "0.12", features = ["vendored", "luajit", "serialize"] }
tracy-client = { version = "0.19.0", features = ["enable"] }
# Protocol crate, pinned exactly: must match the Tracy profiler GUI version
# (Tracy v0.14.1 <-> tracy-client-sys 0.30.0). tracy-client alone accepts a
# wide sys range, so without this pin the protocol version silently drifts.
tracy-client-sys = { version = "=0.30.0", default-features = false }
arrayvec = "0.7"
smallvec = "1.15"
configparser = "3"
fastrand = "2.5"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
imgui = "0.12"
paste = "1"
spin_sleep = "1"
triple_buffer = "9"
thiserror = "2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
glam = { version = "0.33", features = ["libm"] }
libm = "0.2"
tempfile = "3.27.0"
embed-resource = "3"
raylib = { package = "sola-raylib", version = "6.3" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Optimized build for this computer:
# RUSTFLAGS="-C target-cpu=native" cargo build --release
# Build without Lua support:
# cargo build --no-default-features
# Profile with Tracy (start the Tracy GUI first, then connect):
# cargo build --profile release-tracy --features tracy

[profile.release-tracy]
inherits = "release"
strip    = "none"
debug    = 1
