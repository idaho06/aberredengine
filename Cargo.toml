[package]
name = "aberredengine"
version = "0.2.0"
edition = "2024"

[dependencies]
# bevy_ecs = { version = "0.19", features = ["debug"] }
bevy_ecs = { version = "0.19" }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
mlua = { version = "0.12", features = ["vendored", "luajit", "serialize"], optional = true }
tracy-client = { version = "0.18.4", features = ["enable"], optional = true }
arrayvec = "0.7"
smallvec = "1.15"
configparser = "3"
fastrand = "2.5"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
imgui = "0.12"
paste = "1"
spin_sleep = "1"
triple_buffer = "9"
thiserror = "2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
glam = { version = "0.33", features = ["libm"] }
libm = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
raylib = { package = "sola-raylib", version = "6.3", features = ["wayland", "noscreenshot"] }

[target.'cfg(target_os = "windows")'.dependencies]
raylib = { package = "sola-raylib", version = "6.3", features = ["noscreenshot"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
# "debug" resolves system names in bevy_ecs's schedule-build warnings (e.g.
# ambiguity_detection); scoped to dev-dependencies so it applies to `cargo
# test` builds only, not `cargo build`/`cargo run` (edition-2024 resolver
# unifies dev-dependency features per-target, not into the main binary).
bevy_ecs = { version = "0.19", features = ["debug"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Optimized build for this computer:
# RUSTFLAGS="-C target-cpu=native" cargo build --release
# Build without Lua support:
# cargo build --no-default-features
# Profile with Tracy (start the Tracy GUI first, then connect):
# cargo build --profile release-tracy --features tracy

[profile.release-tracy]
inherits = "release"
strip    = "none"
debug    = 1

[features]
default = ["lua"]
lua   = ["dep:mlua"]
tracy = ["dep:tracy-client"]  # profiling — never in default
test-support = []             # headless TestWorld harness — never in default
