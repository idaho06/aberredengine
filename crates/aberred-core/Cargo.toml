[package]
name = "aberred-core"
version = "0.2.0"
edition.workspace = true

[dependencies]
bevy_ecs.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
arrayvec.workspace = true
smallvec.workspace = true
configparser.workspace = true
fastrand.workspace = true
log.workspace = true
spin_sleep.workspace = true
triple_buffer.workspace = true
thiserror.workspace = true
postcard.workspace = true
glam.workspace = true
libm.workspace = true
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
bevy_ecs = { workspace = true, features = ["debug"] }
tempfile.workspace = true
# Self dev-dependency: this crate's own `tests/*.rs` link it as a normal
# dependency (no `cfg(test)`), so `test-support` is what makes
# `aberred_core::testing` visible to them.
aberred-core = { path = ".", features = ["test-support"] }

[features]
tracy = ["dep:tracy-client"]
test-support = []
