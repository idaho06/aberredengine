[package]
name = "aberred-core"
version = "0.2.0"
edition.workspace = true

[dependencies]
bevy_ecs.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
arrayvec.workspace = true
smallvec.workspace = true
configparser.workspace = true
fastrand.workspace = true
log.workspace = true
spin_sleep.workspace = true
triple_buffer.workspace = true
thiserror.workspace = true
postcard.workspace = true
glam.workspace = true
libm.workspace = true
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
bevy_ecs = { workspace = true, features = ["debug"] }
tempfile.workspace = true

[features]
# No mlua dependency here -- this feature exists only so `#[cfg(feature =
# "lua")]` items that are inert in core (name no Lua-only type; see
# CLAUDE.md/docs/plans/workspaces-implementation.md's Phase 2 record) don't
# trip `unexpected_cfgs`, and so the facade can forward its own `lua`
# feature down for bucket-tracking consistency.
lua = []
tracy = ["dep:tracy-client"]
test-support = []
