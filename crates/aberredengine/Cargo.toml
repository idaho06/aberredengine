[package]
name = "aberredengine"
version = "0.2.0"
edition.workspace = true

[dependencies]
aberred-core = { path = "../aberred-core" }
aberred-audio = { path = "../aberred-audio" }
bevy_ecs.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
mlua = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }
arrayvec.workspace = true
smallvec.workspace = true
configparser.workspace = true
fastrand.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
imgui.workspace = true
paste.workspace = true
spin_sleep.workspace = true
triple_buffer.workspace = true
thiserror.workspace = true
postcard.workspace = true
glam.workspace = true
libm.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
raylib = { workspace = true, features = ["wayland", "noscreenshot"] }

[target.'cfg(target_os = "windows")'.dependencies]
raylib = { workspace = true, features = ["noscreenshot"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# "debug" resolves system names in bevy_ecs's schedule-build warnings (e.g.
# ambiguity_detection); scoped to dev-dependencies so it applies to `cargo
# test` builds only, not `cargo build`/`cargo run` (edition-2024 resolver
# unifies dev-dependency features per-target, not into the main binary).
bevy_ecs = { workspace = true, features = ["debug"] }
tempfile.workspace = true
# `aberred-core`'s own `cfg(test)` never fires from this (dependent) crate's
# test build -- unlike `lua`/`tracy`/`test-support` above, which only turn on
# when the facade opts in, `aberred-core/test-support` must be enabled
# UNCONDITIONALLY here so plain `cargo test` on the facade (which implies
# `cfg(test)`, not the `test-support` feature) still reaches
# `aberred_core::protocol::endpoints::setup_audio_stub`, gated
# `#[cfg(any(test, feature = "test-support"))]` in core.
aberred-core = { path = "../aberred-core", features = ["test-support"] }

[features]
default = ["lua"]
lua   = ["dep:mlua", "aberred-core/lua"]
tracy = ["dep:tracy-client", "aberred-core/tracy", "aberred-audio/tracy"]  # profiling — never in default
test-support = ["aberred-core/test-support"]  # headless TestWorld harness — never in default
